<script>
const ARTICLES=[{"number":15,"title":"We need to rethink the Endangered Species Act","subtitle":"To maintain biodiversity, give Americans an incentive to protect it.","paragraphs":[{"n":1,"text":"The Trump administration’s attempt to weaken the Endangered Species Act is easy to criticize. This month, it proposed a rule that would limit what constitutes “harm” under the law to only direct actions against wildlife, such as hunting, wounding or trapping. Destroying their habitats would no longer count."},{"n":2,"text":"Anyone who’s ever seen roadkill littering U.S. highways should understand the flaw in this logic: Species can thrive only when they have space to live free from dangers imposed by humankind."},{"n":3,"text":"It is not enough to simply defend the status quo, however. An honest assessment of the Endangered Species Act would conclude that, alongside its strengths, it has many weaknesses. As scientists warn that the world is entering a period of mass extinction, lawmakers would be wise to rethink federal conservation strategies. This means reforming the act to better incentivize citizens to protect the country’s precious biodiversity."},{"n":4,"text":"Since the law was enacted in 1973, the number of species listed as threatened or endangered has exploded to almost 1,700. This number is something of a political Rorschach test: Environmentalists celebrate the fact that, of those listed, only a small number of species have gone extinct. Critics of the law say that the tiny number that have been delisted shows the law is failing in its mission to actually recover species."},{"n":5,"text":"Both views are valid. Environmentalists are correct that the act’s power to halt projects that could damage ecosystems has rescued from the brink many iconic species, including the bald eagle and the manatee. The same is true of less charismatic species that are essential to the world’s intricate food chains. With insect, bird and fish populations all declining, this is a poor time to gut habitat protections."},{"n":6,"text":"But the scale of the threats to biodiversity — including climate change, invasive species and habitat loss — makes it essential to expand federal conservation strategy beyond punitive measures. The act’s regulatory structure is so slow and bureaucratic, it can take years to list a species as threatened or endangered. The U.S. Fish and Wildlife Service, the primary agency tasked with enforcing the law, has a backlog of hundreds of petitions to list species and has long been starved of resources. Any reform must start with providing the agency the funding and staffing it needs."},{"n":7,"text":"But changes must go deeper. An estimated three-quarters of species listed under the law reside on private land, and protecting them comes at a real cost to landowners. One study in California found that habitat protections for the red-legged frog caused land values to fall 48 percent. For the Bay checkerspot butterfly, they fell 78 percent. This creates a disincentive for people to cooperate with conservation efforts and has even led people to actively destroy habitats to avoid restrictions on their property."},{"n":8,"text":"Why not use those same economic forces for good? The government could, for instance, turn protected species into assets by giving landowners financial incentives to assist in conservation efforts. This is something the Agriculture Department has been doing for years with success. It has paid farmers and ranchers, for example, to maintain soil health and waterways. The same could be done for private landowners whose properties are home to endangered species."},{"n":9,"text":"Costa Rica started such a program in 1997, and it is credited with helping to reverse deforestation there. Today, forest covers more than 50 percent of the country, up from a little over 20 percent in the 1980s. Imagine what could be accomplished if the United States adopted a similar strategy for reversing the loss of species."},{"n":10,"text":"Congress also should consider reforming the Endangered Species Act’s incentive structure. The original intent of the law was to treat “endangered” and “threatened” species differently, with greater restrictions for the former. But in 1978, the Fish and Wildlife Service eliminated that distinction, removing the promise of regulatory relief if states, tribes or private actors managed to rescue vulnerable species from endangerment. Lawmakers could change this back."},{"n":11,"text":"It has also become difficult to delist a species even after it has met its recovery goal, due to threats of litigation. Congress could fix this by adding a “cool-off” period for lawsuits, during which recovered species would be monitored by state officials."},{"n":12,"text":"Environmentalists might object to these changes, arguing that the current administration or the states cannot be trusted to maintain species once restrictions have been lifted. If this is true, then lawmakers should fund rewards for states and tribes that successfully carry out conservation plans. The goal, in short, should be to harness self-interest as the engine for protecting wildlife."},{"n":13,"text":"President Donald Trump and his party are unlikely to embrace these reforms. But Congress in recent years has shown that there is strong bipartisan appetite to strengthen protections for endangered species. The best way forward is to embrace market-oriented strategies."}]},{"number":43,"title":"University-for-all harms poor students the most","subtitle":"Time for sane standards in higher education","paragraphs":[{"n":1,"text":"Academics have always moaned about their students. “Scholarly effort is in decline everywhere as never before,” complained Egbert of Liège, an 11th-century know-it-all, in an age when not even a tenth of humans could read. Recently there have been lots of new worries about standards in colleges and universities—especially in America, home to many of the world’s best. But this time, as our International section notes, the laxity is not just in lecturers’ heads."},{"n":2,"text":"Maths professors report that they are having to pack freshers off to remedial courses before real learning can start. Some are turning up to university ignorant of things they should have learned early in secondary school. Lecturers in humanities warn that students are struggling to understand texts that a decade ago their counterparts would easily have grasped. Students increasingly ask for reading lists to be cut short."},{"n":3,"text":"Tests run by the OECD, a club of mostly rich countries, suggest that students in colleges and universities are less literate than they were a decade ago. The best are cleverer than ever, but a growing number have basic skills that would embarrass a child half their age. About one in seven students at American colleges and universities scores no better in literacy tests than a typical ten-year-old. For numeracy, it is nearly one in five."},{"n":4,"text":"One explanation is the harm to schooling from the pandemic. Another is the fact that, even before covid-19, school marks in America and in many other rich countries were already falling. At the same time, many colleges and universities have been lowering the bar for entry. In America they have largely stopped requiring applicants to sit tests of numerical and verbal reasoning, such as the SAT. Some believe those exercises are unfair to black and Hispanic students. Others are trying to get enough bums on seats as the total number of 18-year-olds in America starts to fall."},{"n":5,"text":"The costs of all this are huge. Time and money spent reteaching basic material cannot be used to help whizz-kids excel. Ill-prepared students are at risk of dropping out, which can hurt their prospects more than if they had never enrolled. And weak students give colleges and universities yet more reasons to dumb down. After years of grade inflation, it is hard to be confident that administrators will solve a tricky new problem: how to handle rampant cheating with AI."},{"n":6,"text":"One way to stop the slide would be to prevent standards in schools from falling. Some insist this is impossible without also solving scourges such as child poverty, or the baleful allure of screens. In fact, marks in Singapore have been inching up for years—and rose even during the pandemic. Schools in England have also been climbing international league tables, thanks in part to reforms that made exams and curriculums more rigorous. Americans are finally recognizing that many of their schools teach literacy using methods that other countries long ago binned as pseudoscience. States that reversed course first, such as Mississippi, have been posting big gains."},{"n":7,"text":"Another remedy would be for leaders in colleges and universities to restore their commitment to high standards, both in whom they choose to admit and in how students are assessed as they learn. America’s best are starting to reintroduce mandatory tests for all applicants; the rest should follow. In May academics at Harvard agreed to rein in grade inflation by imposing a hard limit on the number of A grades they hand out in each course. These had soared from 24% of all grades awarded in 2005 to 60% last year. That was once considered a radical proposal; it ought to be more common."},{"n":8,"text":"And policymakers should widen the ways in which people can keep learning after they leave school. In English-speaking countries, in particular, options other than university are too rare. America has fewer apprentices even than Britain (which has hardly any). America’s community colleges are supposed to act as stepping stones for high-school graduates who need more help. But the share of youngsters who go to them is declining, even as the share heading to demanding four-year universities is going up."},{"n":9,"text":"Education should provide everyone with an opportunity. It must never become a blocker, sprinkling its benefits on a smarmy few while holding the less fortunate in their place. But raising young people up its tiers without granting them the skills they need is not pragmatic, or a kindness, or a blow for racial equity. It is a cowardice that lets everybody down."}]},{"number":8,"title":"Zuckerberg on trial: why Meta deserves to win","subtitle":"Social media has plenty of problems. Lack of competition isn’t one of them","paragraphs":[{"n":1,"text":"The $23m pied-a -terre that Mark Zuckerberg bought last month in Washington, DC, is a seven-bathroom testament to Meta’s devotion to lobbying. As well as donating $1m to Donald Trump’s presidential-inauguration fund and shelling out $25m to settle a spurious lawsuit from the president, Meta has MAGAfied its board, appointing allies such as Dana White and, last week, Dina Powell, who served in Mr Trump’s first administration (John Elkann, the boss of Exor, which part-owns The Economist’s parent company, is also adirector). Mr Zuckerberg has dined at Mar-a-Lago and visited the White House."},{"n":2,"text":"The reason for this frantic schmoozing is a blockbuster antitrust trial that began on April 14th and which threatens to break up Mr Zuckerberg’s $1.3trn empire. The stakes are high and the politics are low. But what matters is that the claim the Federal Trade Commission (FTC), America’s competition watchdog, has brought against Meta deserves to fail."},{"n":3,"text":"The complaint, launched in 2020, alleges that Meta (then called Facebook) illegally maintained its social-media monopoly when it bought Instagram and WhatsApp, two smaller rivals, several years earlier. Though the FTC approved both transactions at the time, it now wants them undone. To establish that Meta is a monopolist, the trustbusters havedescribed its market as “personal social networking”. This is a tendentiously narrow definition that excludes obvious rivals such as X, LinkedIn, Pinterest and Reddit. On this view, the world’s biggest social-media company competes only with Snapchat, a much smaller rival, and MeWe, an even tinier one."},{"n":4,"text":"The FTC’s argument was never compelling, and in the years since the complaint was filed it has only become less persuasive. Despite the FTC’s claim that network effects create insurmountable barriers to entry, the past few years have seen a rush of successful socialmedia startups. Some have fizzled, like Clubhouse and BeReal. Others remain small, such as Bluesky and Mr Trump’s own Truth Social. But the arrival of TikTok, which has attracted more than 1.5bn users worldwide, makes a mockery of the idea that the market is closed. FTC"},{"n":5,"text":"Competition has intensified in other ways, too. Thanks partly to TikTok’s innovation, social apps now revolve around video. That has pitched Meta into competition with giants such as YouTube, whose “Shorts” feature mimics the TikTok-like vertical clips that also play on Facebook and Instagram. Moreover, once-distinct media markets are converging. Spotify, originally a music service, is pushing into video; Roblox, a gaming platform, acts as a social network for many teenagers. As competition spreads across previously separate categories, the FTC’s narrow market definition looks ever sillier."},{"n":6,"text":"What of the experience for consumers, whose interests the FTC exists to defend? The regulator argues that a shortage of competition has created worse products, citing an overload of ads on Meta’s apps. But the idea that consumers have been poorly served by the social-media market in recent years is hard to square with the hours of extra time they are devoting to it. By one estimate nearly half of all mobile screen time worldwide is spent browsing social media (and about a quarter of all waking hours are spent on phones)."},{"n":7,"text":"Ask a parent if they have any concerns about social media and they will chew your ear off, but they are unlikely to complain that their child is short of social apps. Indeed, consumers’ behaviour suggests that—for better or worse—they have seldom encountered a market they find so captivating."},{"n":8,"text":"The shaky case has come to trial at an appropriately farcical moment. As the FTC sets out its claim that Meta faces insufficient competition, the firm’s main rival, TikTok, hangs in legal limbo. Distribution of the Chinese-owned app in America has been outlawed since the beginning of Mr Trump’s presidency. But he has ordered the authorities to ignore the ban—for 75 days, then 150—while he negotiates the app’s sale to an American buyer. No one has the faintest idea whether the app will still be around by the time Meta’s trial is over. How can any serious judgment on competition in social media be made without knowing the fate of TikTok, its greatest disruptive force?"},{"n":9,"text":"What began as a thin case has become progressively weaker, and now looks downright absurd. The court should waste no time in swiping it up and away."}]},{"number":9,"title":"Don’t overlook the many benefits of plastics","subtitle":"If they are a problem, it is because they are badly managed","paragraphs":[{"n":1,"text":"Few people are more synonymous with wonder at the natural world than Sir David Attenborough, a nonagenarian television presenter. In recent years, Sir David has been campaigning fervently for an end to the plastic that his film crews find scattered across the planet. “The plastic in our oceans ought never to have got there in the first place,” he said in one interview. “Much of it perhaps ought not to have even been manufactured at all.” The first statement is reasonable, but the second is not—for it disregards the extraordinary benefits that plastics, and the industry which produces them, have provided both to humans and to the environment."},{"n":2,"text":"Although the drawbacks of the world’s reliance on plastics are all too apparent, the benefits they provide, in the form of reducing waste and cost, are all too easily overlooked. Plastics have made possible a bewildering range of new materials that can replicate the properties of existing ones, and can do things they cannot, while being lighter, more durable, and cheaper and easier to manufacture. These materials have become vital in everything from building to carmaking to consumer electronics."},{"n":3,"text":"Take food as an example. Plastic packaging prevents perishable foodstuffs from spoiling, making possible global trade in meat, fish, fruit and vegetables. It enables essentials like rice, cooking oil and powdered milk to be stored and distributed safely and cheaply. A one-litre plastic bottle weighs 5% as much as a glass one; plastic packaging thus reduces shipping costs and emissions."},{"n":4,"text":"Plastics have also eased the world’s reliance on older materials, and on the living beings from which many of them came. There are perhaps 10m pianos in the world. If all their white keys were made of ivory, how many elephants would remain?"},{"n":5,"text":"Just as the benefits of plastics are often unseen, however, so are some potential harms. The visible blight of discarded waste strewn across otherwise lovely landscapes, often to the detriment of wildlife, used to be one of the principal charges against plastics. Now there is growing concern about what happens when they break up into microscopic fragments invisible to the naked eye. In the past decade such “microplastics” have been found in food chains, in human brains and even in the apparently pristine snow of Antarctica."},{"n":6,"text":"Being detectable does not make something dangerous. It can be mere testimony to the acuity of the instruments in use. But history shows that ubiquitous industrial materials can do unintended, unexpected and widespread harm that is recognised much too late: think of lead-based paint and leaded petrol, which cause health and developmental problems. The ubiquity of microplastics means the harm they might do deserves serious, well-supported and co-ordinated research; some worrying findings make that a matter of urgency. If there are harms, swift action will be needed on diagnosis and remediation."},{"n":7,"text":"To deal with the scourge of pollution the best approach is not to ban plastics, but to manage them more carefully. Better recycling technologies, now under development, are one part of the answer. The proportion of plastics which end up being recycled has doubled in the past two decades, but it is still only 9%. This is not because people do not care about the planet. It is because recycling is harder and more costly than most people realise."},{"n":8,"text":"Technical difficulties and the onerous sorting required mean that recycled plastic is almost always more expensive than the virgin stuff, which makes it hard to set up a virtuously circular market. One result is that many rich countries export their waste for “recycling” in poorer countries which are not equipped to deal with their own often voluminous plasticwaste problems, let alone anyone else’s. The UN estimates that 59% of all plastic waste ends up being sorted by roughly 20m informal workers worldwide, frequently in terrible conditions."},{"n":9,"text":"Greater use should therefore be made of landfill. When properly managed and well monitored, this is far less environmentally ruinous than often portrayed, and can be simpler and more effective than poorly executed recycling. It also sidesteps the risk that plastics sent across the world for recycling will be dumped or burned. Incinerators, which can both produce energy and allow the resulting carbon to be captured, are a useful option too, though they are also unpopular. Fortnum, a Finnish company, has found a way to turn the hydrocarbons released from waste incineration back into plastic feedstock. Such innovation should be built on. When it comes to plastics, the benefits are very much greater than most people will allow—and so is the potential for managing the costs."}]},{"number":49,"title":"Europe is unshackling business. But not enough","subtitle":"Why market liberals must win the battle for Brussels—and national capitals, too","paragraphs":[{"n":1,"text":"Everyone knows that the European Union’s economy is weighed down by regulation. But you may not have spotted that everyone now includes Europeans themselves. They are so rattled that the momentum to fix the problem is the greatest in a generation. On April 28th the EU unveiled plans for its rule-making to be simpler and more consistent. It gave a timeline for accomplishing this, and for removing barriers to trade within the bloc. The trillion-euro question is whether, after many false starts, Europe can at last turn its good intentions into progress."},{"n":2,"text":"Europe needs to grow if it is to pay its debts, care for its swelling legions of elderly citizens and defend itself without America’s help. Yet its economy is far behind that of Uncle Sam. In the first quarter its output barely grew—and now the Iran war has driven up energy prices."},{"n":3,"text":"The battle for growth is being fought on two fronts. The first is in Brussels, where two very different strategies vie for favour. Some eurocrats think the EU should pivot to subsidies, protectionism and Chinese-style state capitalism. Others prefer the liberal route of more open, competitive and integrated markets."},{"n":4,"text":"In recent years the EU’s economic thinking has acquired a more French flavour: somewhat wary of competitive markets and free trade, more in favour of dirigisme. Encouragingly, however, some more liberal attitudes are holding their own. Proposed changes to the EU’s strict merger guidelines once seemed likely to water down the bloc’s traditional devotion to consumer welfare so that “European champions” might emerge. Now it looks as if the rules will be tweaked rather than overhauled. Europe’s commitment to competition survives."},{"n":5,"text":"Still, it is one thing to avoid backsliding. What about progress? As well as the deregulatory push, which includes ten “omnibus” bills aimed at reducing companies’ administrative costs, trade continues to be liberalised. On May 1st a pact between the EU and Mercosur—whose full members are Argentina, Brazil, Paraguay and Uruguay—provisionally came into effect. New agreements have also been struck with India, Indonesia and Australia, and pacts with Malaysia and the Philippines are in the offing. Unlike President Donald Trump’s often superficial and fragile trade deals, these ones are deep and the product of years of work."},{"n":6,"text":"The second fight is at the national level and will be harder to win. Much rule-making power sits with national governments, which love to blame Brussels for their own red tape. They often choose to protect domestic firms, especially from foreign competition in services. They also make the EU’s rules more burdensome when writing them into domestic law. Politicians are under constant pressure from protectionists who resist everything from connecting up electricity grids to letting firms registered in one country operate in another."},{"n":7,"text":"Reforms at the national level are slow. Each government is one of 27. Too few share Brussels’ new sense of urgency. Many are loth to take on vested interests, hoping to reap the benefits of reform in other countries without having to pay a political price themselves. With recent changes, such as with Denmark’s postal service or Dutch pensions, the action has mostly been in market-friendly places. Countries bogged down with rules, such as Italy and Germany, have done too little."},{"n":8,"text":"Boosting European growth requires national governments to join the liberalising effort. It also means implementing many of the other recommendations set out in the dossiers penned by Enrico Letta and Mario Draghi, two former Italian prime ministers. Europe’s startups need more capital, which might be provided by adequately funding pension schemes while continuing to integrate capital markets across borders. The continent must attract more of the world’s most talented workers, with bloc-wide visa schemes and by recognising foreign qualifications. And it needs cheaper energy, which requires investment in its grid and the careful design of markets as more renewable power comes online."},{"n":9,"text":"None of this will be easy. The EU has endless counterproductive regulations. Attempts to get rid of them often fail, not least because reactionaries on the left and right defend them. But Europe is also a huge economy of 450m people, with nearly a fifth of global output. Will the wealth of that prize and the dire consequences of failure make this time different? More than ever, Europeans need to simplify and deregulate."}]},{"number":24,"title":"Mythbusting on trustbusting","subtitle":"The European Commission should think twice before watering down its merger rules","paragraphs":[{"n":1,"text":"A N air of gloom hangs over European companies. On the global stage, many are dwarfed by America’s tech titans and China’s industrial giants. The European Union is home to only three of the world’s top 50 tech firms, by market capitalisation; its largest bank ranks 16th globally. To dispel the misery, some think the bloc’s strict competition policy needs updating. The European Commission, which enforces antitrust rules, will soon publish draft guidelines that are expected to be more lenient. Encouraging firms to scale up is a laudable aim. Weaker competition policy would not achieve it."},{"n":2,"text":"The debate about the purpose of European competition policy is as old as the European project itself. The principled view, which came to dominate, is that a robust competition policy serves consumers, growth and innovation by ensuring that no firm achieves a controlling share of its market. A more political view is that it should serve wider goals, including national security and industrial policy."},{"n":3,"text":"As policymakers seek to prepare the continent for harsher geopolitical times, it is no surprise that the political view is gaining favour (see Business section). Mario Draghi, a former Italian prime minister, argued in an influential report that competition policy needs to change to support innovation and secure supply chains. Ursula von der Leyen, the president of the European Commission, has gone a step further, arguing for “European champions” and “merger guidelines that reflect the realities of the global market, not just the European one”."},{"n":4,"text":"Loosening competition policy would be misguided. The hurdles in the way of bigger European businesses are not merger rules but parochial politicians and a variety of other regulations, as the examples of banking, telecoms and defence show. Start with banks. The absence of large pan-European lenders is not because of trustbusters. Banking remains a national market. Local supervisors prevent banks from moving capital and liquidity seamlessly between a parent institution and its foreign subsidiaries. There is still no unified deposit-insurance scheme. And politicians are fiercely protective of national champions, as the attempt by UniCredit, an Italian bank, to take over Commerzbank in Germany shows. The German government opposes the merger, claiming it would undermine funding for the Mittelstand."},{"n":5,"text":"Telecoms is not a truly integrated market, either. Spectrum auctions are largely national, as are rules around security, emergency services and the like. More than 270 regulators oversee digital networks across the EU. As long as a customer in France cannot easily buy services from an Estonian provider, mergers are likely to increase market power and raise prices."},{"n":6,"text":"Defence, the third example, is similarly fragmented, even though competition policy has already been loosened. The main reason is that governments want to keep their defence industries on a tight rein. More pan-European procurement and a dose of competition from startups would do far more to spur both innovation and consolidation."},{"n":7,"text":"Each example shows that the barrier to scale is not competition policy, but the fact that the single market remains incomplete. Indeed, where the market is fully integrated, European firms have managed to achieve world-beating results. Just think of ASML, which has a near- monopoly on the most important chipmaking machines in the world, or firms like Spotify and SAP, which hold their own against global rivals. European pharma is a rich ecosystem made up of research institutes, smaller upstarts and corporate giants."},{"n":8,"text":"Integrating financial and digital services across borders is a much knottier task than diluting merger rules, in large part because it means encouraging national governments to loosen their grip. But if Europe really is to compete on the global stage, there is no substitute for hard graft."}]},{"number":13,"title":"Artificial intelligence : DeepSeek,and ye shall find","subtitle":"China’s hottest AI model has panicked investors. But it is a cause for optimism for the world at large","paragraphs":[{"n":1,"text":"The market reaction, when it came, was brutal. On January 27th, as investors realised just how good DeepSeek’s “v3” and “R1” models were, they wiped around a trillion dollars off the market capitalisation of America’s listed tech firms. Nvidia, a chipmaker and the chief shovel-seller of the artificial-intelligence (AI) gold rush, saw its value fall by $600bn. Yet even if the Chinese model-maker’s new releases rattled investors in a handful of firms, they should be a cause for optimism for the world at large. DeepSeek shows how competition and innovation will make AI cheaper and therefore more useful."},{"n":2,"text":"DeepSeek’s models are practically as good as those made by Google and OpenAI—and have been produced at a fraction of the cost. Barred by American export controls from using cutting-edge chips, the Chinese firm undertook an efficiency drive, even reprogramming the chips it used to train the model to eke out every drop of power. The cost of building an AI model that can stand toe-to-toe with the best has plummeted. Within days, DeepSeek’s chatbot was the most downloaded app on the iPhone. DeepSeek"},{"n":3,"text":"The contrast with America’s approach could not be starker. Sam Altman, the boss of OpenAI, has spent years telling investors—and America’s new president—that vast sums of money and computing power are needed to stay at the forefront of AI. Investors have accordingly been betting that a handful of firms stand to reap vast monopoly-like rents. Yet if fast followers such as DeepSeek can eat away at that lead for a fraction of the cost, then those profits are at risk."},{"n":4,"text":"Nvidia became the most valuable listed company in the world thanks to a widespread belief that building the best AI required paying through the nose for its best chips (on which its profit margins are reported to exceed 90%). No wonder DeepSeek’s success led to a stockmarket drubbing for the chipmaker on January 27th. Others in the data-centre business are also licking their wounds, from Siemens Energy (which would have built the turbines to power the build-out) to Cameco (which would have provided the uranium to fuel the reactors to turn the turbines). Had OpenAI been listed, its stock would surely have taken a tumble as well."},{"n":5,"text":"Yet there are far more winners than losers from the DeepSeek drama. Some of them are even within tech. Apple will be cheering that its decision not to throw billions at building AI capabilities has paid off. It can sit back and pick the best models from a newly commoditised selection. Smaller labs, including France’s Mistral and the Emirati TII, will be racing to see if they can adopt the same improvements, and try to catch up with their bigger rivals."},{"n":6,"text":"Moreover, efficiency gains are unlikely to result in less spending on AI overall. The Jevons paradox—the observation that greater efficiency can lead to more, not less, use of an industrial input—will surely come into play. The possible applications for a language model with computing costs as cheap as DeepSeek’s ($1 per million tokens) are vastly more numerous than those for Anthropic’s ($15 per million tokens). Many uses for cheaper AI are as yet unimagined."},{"n":7,"text":"Even Nvidia may not suffer too much in the long run. Although its market clout may be diminished, it will continue to sell chips in vast quantities. Reasoning models, including DeepSeek’s R1 and OpenAI’s o3, require much more computing power than conventional large language models to answer questions. Nvidia will be hoping to supply some of that."},{"n":8,"text":"However, the real winners will be consumers. For AI to transform society, it needs to be cheap, ubiquitous and out of the control of any one country or company. DeepSeek’s success suggests that such a world is imaginable. Take Britain, where Sir Keir Starmer, the prime minister, has unveiled a plan to use AI to boost productivity. If he does not need to pay most of the efficiency gains back to Microsoft in usage fees, his proposal has a better chance of success. When producers’ rents vanish, they remain in the pockets of users."},{"n":9,"text":"Some have begun to suggest that DeepSeek’s improvements don’t count because they are a consequence of “distilling” American models’ intelligence into its own software. Even if that were so, r1 remains a ground-breaking innovation. The ease with which DeepSeek found greater efficiency will spur competition. It suggests many more such gains are still to be discovered."},{"n":10,"text":"For two years the biggest American AI labs have vied to make ever more marginal improvements in the quality of their models, rather than models that are cheap, fast and good. DeepSeek shows there is a better way."}]},{"number":18,"title":"Let Consumers Decide Whether to Eat LabGrown Meat","subtitle":"Protectionist policies threaten to impede the fledgling sector, which could play a key role in making the planet a greener one.","paragraphs":[{"n":1,"text":"The stretch of Interstate 5 that runs through the heart of California’s sunbaked Central Valley would be forgettable if not for the stench of manure. Cattle ranches, some tightly packed with livestock, sprawl to the horizon.As demand for meat continues to soar, it’s hard to blame these hardworking ranchers for earning a living. Yet the risk such livestock pose to the climate is undeniable: A single California cattle ranch emits as much methane annually as 165,000 cars. Statewide, cattle produce more of the pollutant than almost every oil and gas basin in North America."},{"n":2,"text":"In the not-too-distant future, well-meaning carnivores could have a much cleaner alternative: lab-grown meat."},{"n":3,"text":"Unlike plant-based foods that aim to taste like meat, so-called cultivated versions — made from biopsied animal cells, in regulated manufacturing sites — (almost) constitute the real thing. The fledgling industry has its hurdles, not least winning over a skeptical public and wary politicians. All the same, it shouldn’t be impeded: The sector exemplifies precisely the kind of ambitious, inventive thinking needed to confront the world’s climate challenges."},{"n":4,"text":"The first lab-grown burger debuted more than a decade ago. It originated from the stem cells of a dead cow, which were put into a gel and left to grow for three months. Some 20,000 muscle fibers, stored in separate vials, were combined to form a 3.5-ounce patty that was cooked before an audience in London. The $325,000 burger garnered mostly positive reviews — though it could have used more fat and, one reviewer quipped, a pinch of salt."},{"n":5,"text":"More recent versions are getting cheaper and tastier, if not less clinical. Roughly 175 miles northwest of California’s cattle ranches, tucked in an unmarked Bay Area facility, Upside Foods can produce thousands of pounds of chicken from a single thumb-sized vial of cells. The cells are transferred to a flask, rocked in an electronic “cradle” (they need movement to grow), and placed in a ceiling-high industrial tank full of nutrient-rich broth. After two to three weeks, the chicken cells are removed and concentrated, leaving a pancake-batter-like mix that can be shaped into filets and prepared as conventional meat."},{"n":6,"text":"Upside is one of more than 170 cultivated meat and seafood startups globally that have raised $3.1 billion over the past decade. Conservative forecasts suggest the sector can reduce land use for beef production by 10-fold and carbon emissions 12-fold. With global meat demand expected to rise by more than 50% by 2050, the potential benefits could be profound. Upside"},{"n":7,"text":"Implausible as it may seem: Upside’s chicken is delicious. The company’s biggest obstacle, rather, is likely to be political. Alabama, Florida and Mississippi have banned lab-grown meat, purportedly to protect cattle ranchers and farmers. (Upside sued the state of Florida.) Montana and Wyoming are considering similar measures. Such prohibitions make little sense. Ranchers won’t be threatened anytime soon: The sector is projected to meet just half a percentage point of global demand by 2030. More to the point, some of the biggest industrial food companies are investing in the industry. A protectionist panic is hardly in order."},{"n":8,"text":"Another concern is economic. To date, Upside’s meat has been sold in one San Francisco restaurant that caters to the rich and curious. Although manufacturing innovations have slashed prices in recent years, reaching parity with conventional meat will be a challenge. Allowing the sector to qualify for loan guarantees in line with traditional farmers would help level the playing field. Streamlining regulatory approvals, currently shared between the Food and Drug Administration and the Department of Agriculture, would get more competitors on the market quicker. Lowering barriers for renewable energy — nuclear, in particular — not only would reduce costs but also ensure the sector can deliver on its promise of cutting emissions."},{"n":9,"text":"Lab-grown meat won’t — and at this stage, can’t — replace traditional beef, pork or poultry. Given the sector’s vast potential, though, policymakers should remove arbitrary barriers, unleash the forces of capitalism and let American consumers decide its fate. The planet will be better for it."}]},{"number":40,"title":"Vote for Claude：Artificial intelligence is creeping into American lawmaking","subtitle":"State legislators love using chatbots","paragraphs":[{"n":1,"text":"KENT ROE is a busy man. In addition to his full-time job as a farmland appraiser, he sits on the board of a utility company and on the council of his local Lutheran church. If that wasn’t enough already, for up to 40 days a year he serves as one of 70 lawmakers in South Dakota’s House of Representatives. It is gruelling work, without much help. South Dakota has the smallest legislative staff in the country; roughly 60 staffers help lawmakers with research and drafting legislation."},{"n":2,"text":"These days Mr Roe relies increasingly on artificial intelligence (AI) to manage his workload. The representative says he uses AI chatbots for research, crafting arguments and mulling over talking points. “Honestly I love it,” he enthuses. “It’s a search engine on steroids.” He sometimes uses AI to help write bits of legislation, too. The lawmaker runs first drafts of bills through Grok, an AI tool developed by Elon Musk’s xAI, to refine his ideas or check which other states might have passed similar laws. He likes to prompt Grok to apply what he calls a “constitutional stress test” on proposed legislation. “It’s an accepted tool, same as a calculator is to do math, or a cell phone is to do phone calls,” he points out. “We’re not in the world of buggy whips anymore.”"},{"n":3,"text":"Usage of AI is booming among state lawmakers and their staff. A survey by the National Conference of State Legislatures, a non-partisan grouping of sitting lawmakers, found that 44% of state legislative staff used AI in their work last year, up from just 20% in 2024. Governors and state agencies are also adopting the technology, in part to prune back excessive and badly written regulations. Doomers warn of a deluge of AI-generated “slop laws” gumming up legislatures, to say nothing of representatives merely regurgitating whatever Claude or ChatGPT tells them. AI"},{"n":4,"text":"Most state legislators turn to AI out of need. “You have a lot of workload and no staff to help you out,” laments Nick Hoheisel, a Republican member of the Kansas House of Representatives. He says research that previously took him hours can now be done in a matter of minutes. AI can also help stretched legislators, who are expected to grasp a bewildering array of policy issues, push back against better-resourced lobbyists. Monique Priestley, a Democratic member of the Vermont House of Representatives, says she uses AI to fact-check lobbyists on the fly during committee hearings. “I’ve actually caught lobbyists in lies,” she says."},{"n":5,"text":"For lawmakers using general-purpose models, however, AI making stuff up is a big problem. Mr Roe says he occasionally runs an AI prompt “ten times or a hundred times over” to calibrate for the right answer. Mr Hoheisel, for his part, says AI models hallucinate the most when it comes to case law. In any case, bills drafted with the help of AI are still overseen by lawyers, editors and researchers, notes John McCullough, the head of South Dakota’s legislative research council. But lawyers on legislative councils deal with crushing workloads as it is; a wave of AI-slop laws might easily overwhelm them."},{"n":6,"text":"At a deeper level, there is growing unease that lawmakers too reliant on AI may find it harder to think critically on important issues. Thought processes like writing, problem-solving and reasoning are inherent to the job. Offloading that to an AI raises stark questions about what it means to be a legislator. “I do worry that chatbots take away independent thought,” admits Mr Hoheisel in Kansas. “Your constituents aren’t electing Claude or ChatGPT. They’re electing you.”"}]},{"number":42,"title":"Nordic education：Why Swedish schools are going unplugged","subtitle":"Nordic pupils are returning to books and pens","paragraphs":[{"n":1,"text":"When Cecilia Rosenbaum saw a book-spine staircase where the vertical part of each step was adorned with colourful stickers showing “Peter Pan”, “Charlie and the Chocolate Factory” and other titles of beloved children’s books, she decided to copy it for her school. The principal of Montessori Mondial Kungsholmen, a grundskola (mandatory nine-year comprehensive school), is on a mission to get her charges to read more. During break, books are brought out to the park in front of the school. Each day starts with 15 minutes of reading in class. One day a week the teacher reads aloud for everyone."},{"n":2,"text":"Once the country with the world’s highest literacy rate, Sweden’s reading standards have declined of late. In 2022 (the latest available data) Sweden’s reading score in PISA, a worldwide study of 15-year-olds’ literacy and other skills, had fallen by 19 points over four years to 487. That compared with 516 for Ireland and 543 for Singapore, the top performer. “Around 25% of Swedish pupils struggle to read properly,” says Lotta Edholm, the higher-education minister. In her view this is “linked to an overreliance on digital tools without sufficient evidence of their effectiveness”."},{"n":3,"text":"Ms Edholm is determined to dial down digital education. “Från skärm till pärm” (from screen to binder) is her centre-right government’s slogan for its “back to basics” policy to reduce the use of computers and tablets in favour of handwriting and old-school textbooks. In August this year mobile phones will be banned at all grundskolor. In 2023 the government launched an ambitious investment programme to reach its goal of providing one textbook per pupil per subject. So far it has spent over SKr2bn ($216m) to bring back books and it will continue to invest in offline reading, handwriting and numeracy."},{"n":4,"text":"Others in Europe and America are engaged in a return to books and pens in schools, but none as quickly as Denmark, Sweden and Finland, countries that are otherwise enthusiastic adopters of digital technologies. Last year Finland, home of Nokia, one of the world’s mobile-phone pioneers, introduced strict restrictions for the use of mobile phones during school lessons for children aged 7-16. Denmark will follow this year with a law mandating a ban on phones and private tablets for folkeskole, primary and lower-secondary schools, up to the age of 16."},{"n":5,"text":"“It’s expensive to go back to books,” says Merete Riisager, a former Danish education minister. Denmark pioneered tablets at school from 2011, but provided teachers with little training. “Our teachers were at sea,” says Kara Barker-Astrom, the principal of Stockholm’s VRG Campus Viktor Rydberg, an upper-secondary school. The country has since come to regret its digital drive. Ms Riisager reckons that tablets played a role in the deterioration of reading and maths skills of Danish pupils. “"},{"n":6,"text":"The scientific evidence for the benefits of phone bans is still thin, but it is growing. “Overall everyone agrees that restricting the use of phones is good for the attention of kids,” says Lucia Magis-Weinberg of the University of Washington."},{"n":7,"text":"A study published in October showed that a “bell to bell” phone ban in a large school district in Florida initially led to an increase in student suspensions. Yet it found big improvements in test scores in the second year of the ban. And it found that the phone bans considerably reduced truancy as students adjusted and began to enjoy the experience of not being constantly attached to their screens. Better attendance might explain some of the improvement in test scores. Even so, Ms Magis-Weinberg cautions that there is no one-size-fits-all policy. 10"},{"n":8,"text":"Ms Barker-Astrom welcomes many of Ms Edholm’s policies but warns against the pendulum swinging too far. Kids older than 16 need to be able to use phones and laptops as the material they are studying becomes more complex and to prepare them with the digital skills that are required in university and the workplace. Even so, her school still switches off the internet during exams: the temptation to cheat, or scroll, is just too strong."}]},{"number":50,"title":"Teachers need help with AI. A union is offering training – with $23m in funding from big tech","subtitle":"Partnership between American Federation of Teachers, one of the largest labor unions in the US, and AI firms has stirred controversy","paragraphs":[{"n":1,"text":"Darius Saczuk, a high school teacher, views artificial intelligence as his enemy. Earlier this year, he and several dozen New York City teachers spent the day inside a windowless conference room in downtown Manhattan to learn how to use AI and prevent students from outsourcing their thinking to it. As Saczuk sees it, he needs to understand his enemy in order to beat it."},{"n":2,"text":"“It’s killing our jobs, it’s changing our society, it’s replacing humans,” said Saczuk, who teaches English as a new language at Long Island City high school in Queens. “In order to retain my job, I need to know how to use AI because it’s not going away.” So he turned to training offered by the American Federation of Teachers, one of the largest labor unions in the US with roughly 1.8 million members, at its new National Academy for AI Instruction. Last year, the academy began offering in-person and virtual AI training across the country. The goal is to train 400,000 educators over the span of five years, helping them understand AI’s benefits and potential harms and also shape how it’s used in the classroom. “"},{"n":3,"text":"Without guidance from their schools or districts, many teachers are left to figure out whether and how to use AI tools. Though the AFT’s $23m training initiative is one of the few structured programs for teachers, its funding, provided entirely by Microsoft, OpenAI and Anthropic, is stirring controversy. Supporters say the training is necessary for the future, but critics argue the academy pushes AI into classrooms, steering teachers toward tools that undermine students’ learning. AI has become a ubiquitous force in classrooms, despite the lack of official guidance. More than half of polled teens say they use AI for help with schoolwork and nearly six in 10 think using AI to cheat is a regular occurrence at their schools, according to a Pew Research Center survey conducted last fall."},{"n":4,"text":"Meanwhile only about four in 10 teachers say their schools offer professional development or training related to AI, according to a recent NPR/Ipsos poll. And about half of all teachers polled say their school hasn’t offered any guidance on AI, or they are unclear on what it is. Teaching educators about AI is a “moral imperative”, said Randi Weingarten, the AFT president. She argues that AI training empowers teachers to make informed decisions about how, when or whether to use AI in their instruction. And without outside funding, it was a choice between taking big tech’s money or doing nothing, she said."},{"n":5,"text":"“There was no fairy godmother philanthropist that was sprinkling millions of dollars on us to actually create a mechanism to educate,” Weingarten said. “I am not promoting the use of AI. Educators need to know the tool.” For Microsoft, which is contributing the largest share of funding at $12.5m, the goal is to give educators a voice in shaping how AI products are used, said Justin Spelhaug, leader of Microsoft’s education, workforce and non-profit programs. “"},{"n":6,"text":"“By partnering with teachers’ unions … we believe we can learn directly from teachers on what they want and need in their classroom,” he said in a statement. But Watters asserts that AI’s presence in the classroom is not a foregone conclusion. “The industry would very much like us to believe that it’s not going away,” Watters said. “But the future is unwritten.” “"},{"n":7,"text":"Tech company leaders have largely painted AI as beneficial to education, some even claiming AI could replace teachers. But experts say there’s still a lack of research proving whether AI actually improves learning outcomes. In a 2024 blogpost, Sam Altman, the OpenAI CEO, said he envisioned a future where “children will have virtual tutors”. AI could replicate some of the meaningful experiences teachers provide, such as making students feel understood and inspired, Greg Brockman, the OpenAI president, said in 2023 on the Possible podcast, hosted by Reid Hoffman, the LinkedIn co-founder, and Aria Finger, his chief of staff."}]},{"number":31,"title":"Robots serve the people：China wants more robots but not fewer workers","subtitle":"A human-first approach to automation","paragraphs":[{"n":1,"text":"A year ago the city of Qingdao had just a handful of autonomous vehicles. Now it has more than almost anywhere else on Earth. One firm, Neolix, has put around 1,200 unmanned delivery vans on local roads; it hopes to have 4,000 by the end of the year. With several other autonomous taxi and food-delivery projects under way, Qingdao exemplifies how rapidly artificial intelligence is transforming China. It is also the front line of the clash between unmanned vehicles and drivers."},{"n":2,"text":"Autonomous cars and drones are being deployed in China at a dizzying pace. About 33,000 short-range delivery vehicles, including the ones in Qingdao, were on Chinese roads at the end of 2025. The number of unmanned cabs is expected to hit 14,000 by the end of 2026. Goldman Sachs, a bank, reckons that more than 700,000 robotaxis (meaning 12% of all ride-hailing vehicles) will roam Chinese cities within five years. Meituan, a delivery super-app, believes it could use drones for 10% of the country’s instant food deliveries, of which 60bn were made last year."},{"n":3,"text":"Though each such delivery is a technological miracle, in the short run it may deprive a human driver of a fare. This puts Chinese leaders in a bind: they want to lead the world in AI and automation but not destroy jobs. An economic plan for the next five years says the country must “prevent and resolve large-scale unemployment risks”. In April a cyber-security watchdog told developers in a draft document that they should “not apply AI with the goal of replacing human employment”."},{"n":4,"text":"The first question is whether technology will be able to replace millions of drivers in short order. Projects have been launched in dozens of Chinese cities, but growth has slowed owing to congestion and technical glitches. No company has deployed more than 1,200 vehicles in any one city. The size of Neolix’s fleet in Qingdao has fluctuated in response to traffic jams caused by its vans. Although these are permitted to drive at any time, they are only allowed to make deliveries in off-peak daytime hours. Even so, on an April morning near a large wholesale market, bands of Neolix vehicles could be seen clogging up the road to honks and jeers."},{"n":5,"text":"In the city of Wuhan, home to one of the world’s biggest robotaxi projects, autonomous vehicles have also jammed traffic. Baidu, a tech giant and Wuhan’s main operator of driverless taxis, has a fleet of around 1,000 for well over a year. It may not grow for a while. In March dozens of Baidu’s cabs suddenly froze, snarling up traffic and prompting a rescue effort for stranded passengers. Since then the central government has suspended the issuance of new licences for robotaxis."},{"n":6,"text":"A second question is which jobs are threatened and which are safe in the longer run. Authorities in Qingdao are not worried about unemployment caused by Neolix, says Wang Honglei, a company executive. In fact, senior officials in the wider Shandong province want as many as 15,000 driverless short-delivery vehicles on roads by the end of 2027. One reason for the insouciance is the sort of human drivers these might displace. Neolix runs only business-to-business services, such as delivering meat from markets to restaurants. Many people who do this are in their 60s and drive small, three-wheeled vehicles that tip over in traffic. Few young people seek to replace them when they retire because this perilous work pays poorly and entails a lot of heavy lifting. This makes machines the obvious choice for the job."},{"n":7,"text":"Drivers who ferry people to their destinations and packages to consumers are another matter. Tech platforms employ around 22m such workers; many more drive city cabs. The platform workers are generally young, rural migrants in cities and people who have lost other work. Youth unemployment is already high and officials do not want to make it worse."},{"n":8,"text":"Another crucial difference is that taxi and delivery drivers have been better at organising strikes and protests. They did just that in Wuhan in 2024, as Baidu’s project was gaining momentum. In response city officials told Baidu to stop publicising its robotaxi figures. Authorities, though supportive of the technology, fear social disruption far more than tech glitches."},{"n":9,"text":"To allay those fears, the biggest automation companies are providing help to the disaffected. Meituan has started training delivery drivers to help operate drone deliveries in Shanghai. Jobs range from loading food onto drones to monitoring flights from a command centre. So far only 200 people are on this team, compared with millions of drivers. But this will expand, says Mao Yinian of Meituan. Whereas the company previously only trained its own employees for such work, he says, it now trains other workers, too. These include staff at hospitals, where drones already deliver some test samples."},{"n":10,"text":"The point of automation is ultimately to replace workers, who need to be paid a regular wage, with robots, which do not. This will eventually end up being true in China, too. In the meantime, a world anxious about an AI jobs apocalypse will be watching the Chinese experiment in human-first automation closely."}]},{"number":44,"title":"Why philosophy is having a moment","subtitle":"A world of clever machines makes it newly relevant","paragraphs":[{"n":1,"text":"IN THE PAST TWO decades philosophy seemed passé. History had ended, and an increasingly materialistic world had no use for students of materialisms. The sciences, offering a path to a lucrative career in Silicon Valley or on Wall Street, reigned supreme. Their queen had been dethroned."},{"n":2,"text":"The number of philosophy degrees handed out by American universities declined from close to 8,000 in 2011 to less than 6,000 in 2024; in computer science it more than doubled to over 100,000. In 2015 Japan’s education minister asked the country’s universities to take “active steps to abolish” social-science and humanities departments “or convert them to areas that better serve societies’ needs”. A love of wisdom would still ease entry into the British establishment, so long as you bundled it with politics and economics at Oxford."},{"n":3,"text":"Now, as technology up-ends what society needs, philosophy is staging a royal comeback. Its practitioners are in high demand. Philosophy majors are already likelier to be employed than computer scientists, according to the New York Federal Reserve. Both freshly minted Wittgenstein wannabes and their professors are being snapped up by artificial-intelligence companies, where they test models’ reasoning and imbue them with morals. Anthropic has a resident philosopher (main task: teach its Claude chatbot to be good). Palantir is run by one."},{"n":4,"text":"It is no surprise that deep familiarity with thought experiments is in vogue as some of these escape from the mind into AI labs and from there into the wild. Yet in a world of thinking machines, a philosophical education, once regarded with bemusement by employers and horror by ambitious parents, looks more relevant than ever—and far beyond big tech."},{"n":5,"text":"One reason is that as AI gets better than knowledge workers at answering small questions, about the next line of computer code or the next trade to place, people are likely to focus on big ones. Large language models may commoditise expert knowledge. But that makes knowing how to think, which is the main skill drummed into philosophy students, all the more valuable."},{"n":6,"text":"In finance, for instance, algorithms already beat humans at predicting directional moves in stock and bond markets. Yet good macro traders outmatch them when it comes to placing bets of the right size to make money consistently. The best are philosophers at heart—or, like George Soros, who studied philosophy in London under Karl Popper, on paper, too. Similarly, many successful venture capitalists were trained as philosophers (Peter Thiel and Reid Hoffman) or fancy themselves as such (Marc Andreessen)."},{"n":7,"text":"One day machines may surpass people at tackling those bigger questions. AI, after all, keeps getting better at extracting the often unspoken rules on which people rely to produce outputs, be it an investment decision, a TikTok clip or a treatise on ethics. Yet the tacit knowledge of how these outputs are produced—which is what AI models do using statistical inference—is one thing. It is quite another to understand why they are produced or how they are subjectively experienced by the human mind. And this still leaves the biggest questions of all. What is real? What is right? What does it mean to be?"},{"n":8,"text":"You do not have to be a strict Protagorean (“Man is the measure of all things”) to believe human answers to these questions may differ from those of machines. If AI ushers in a Utopia of economic plenty, where poverty is gone and paid work is optional, humanity will have disentangling all this to keep it busy. If the robots take over, a philosopher can always tell you which Stoics are the best read. In all imaginable scenarios in between, and some unimaginable ones, philosophical thinking will remain a source of human wisdom."}]},{"number":23,"title":"The placebo effect：Mind over matter","subtitle":"A new study highlights the brain's role in immune health","paragraphs":[{"n":1,"text":"The placebo effect, in which a patient’s subjective belief can affect the efficacy of treatment, was once maligned as dubious and unscientific, but is now recognised as a genuine, albeit poorly understood, therapeutic tool. In a study published this week in Nature Medicine, researchers have begun to lift the lid on its inner workings by demonstrating that positive expectations can boost the immune system’s response to vaccination."},{"n":2,"text":"Nitzan Lubianiker and Tamar Koren, a pair of neuroscientists at Tel Aviv University, wanted to understand the brain’s role in regulating immune health. They chose to focus their attention on the mesolimbic network, a brain region associated with reward-related behaviour and also known as an area linked to immune function in mice. To this end, they recruited 85 volunteers to undergo an advanced form of brain training, allowing each of them to exert some influence over neural processes usually outside conscious control."},{"n":3,"text":"Participants were shown representations in real time of their brain’s activity, converted into simple indicators such as changing numbers or a moving graph. Their goal, as explained by the experimenters, was to develop mental strategies, such as picturing an image or recalling a trip, which consciously directed neural activity to different brain regions. Each participant was encouraged to develop his or her own personalised approach. Over repeated sessions participants learnt, by trial and error, which strategies lit up which parts of the brain."},{"n":4,"text":"The researchers divided their volunteers into three groups. One trained to activate the brain’s reward system. A second trained to activate an unrelated brain network. The third received no target or training. Each group completed four sessions, in which those in training groups developed and refined their individual strategies to shift activity to the assigned region. Immediately after the final session, everyone received a hepatitis B vaccination as a standardised challenge to the immune system."},{"n":5,"text":"Blood samples taken before and after vaccination revealed a striking link between brain activity and immune response. Several parts of the mesolimbic network were activated during training, even in those not trying to do so. However, in all participants, activity in one particular region—the ventral tegmental area—displayed a positive correlation with levels of vaccine-induced antibodies. Following an analysis to rule out alternative explanations, the researchers suggest that this is the first direct evidence of a brain-immune regulatory system in humans."},{"n":6,"text":"To understand the psychology behind this, Dr Lubianiker, Dr Koren and their colleagues compared and categorised the various strategies adopted by participants. This analysis found that sustained activity in the ventral tegmental area was specifically linked to positive expectations—hopeful thoughts about the future—and that this connection strengthened through the training procedure. In contrast, general positive emotions, such as pleasure or love, did not display such a relationship."},{"n":7,"text":"The team’s research provides compelling evidence for the brain’s influence on physiology. A deeper understanding of this mind-body connection, they hope, could pave the way for new non-invasive procedures that boost immune health, with possible applications in cancer immunotherapy and against chronic inflammation."},{"n":8,"text":"This work may also help understanding of the biological mechanism of the placebo effect itself. Positive expectations have long been associated with placebo responses. Only now, though, have researchers observed the specific role of such emotions in activating the reward centre of the brain, and their downstream influence on immune response. More extensive trials are needed to establish the full implications of that for the placebo effect. But this demonstration of such a clear example of the link between brain and body means a potentially underused clinical tool is gaining a firmer scientific footing."}]},{"number":19,"title":"Renaissance art：A room with no view","subtitle":"Michelangelo's fingerprints are all around-or are they?","paragraphs":[{"n":1,"text":"standing IN THE mausoleum of the Medici chapel in Florence, among tombs and elegant sculptures designed by Michelangelo, you could be excused for failing to notice the doorway to the left. It leads to a cloakroom, where a trap door opens to a flight of narrow steps. At the bottom is a small vaulted room. The eggshell white walls are covered with graceful nude figures, a falling Phaethon (son of the sun god), a looming horse's head and several shapely legs drawn in shadowy charcoal sketches,the museum claims, by the great Renaissance artist himself."},{"n":2,"text":"This stanza segreta (secret room) had long been closed. Only scholars and bigwigs like King Charles III and Leonardo DiCaprio were allowed entry by the National Museum of the Bargello, of which the chapel is a part. But in November the basement room was opened for a trial period of four months to 100 prebooked visitors a week; they are allowed in for 15 minutes in groups of four. Tickets sold out. Officials recently extended the experiment until July."},{"n":3,"text":"Entering the room, which is bare except for ankle-level strips of LED lighting, is like stepping back in time-not just into the Renaissance, but also into an earlier era of tourism, when attractions lacked explanatory placards and were free from madding crowds. Most of all, it feels like entering someone's head, or their notebook, filled with drafts and doodles, some finely wrought, some cartoonish. You can imagine the middle-aged master in here, perhaps drawing by night. In several places, the walls appear to be scorched with black soot from a burning torch.Near a rendering of a muscular figure, there is even a smudged handprint."},{"n":4,"text":"Legend has it that Michelangelo holed up in this stanza segreta for a few months in 1530.Following a popular uprising three years before, the artist sided with those who preferred a republic to rule by the Medicis, Italy's wealthiest family, even though he had designed the mausoleum that bears their name. When the Medicis returned, the artist was in danger. This small room, conveniently furnished with a well, might have seemed like a safe haven."},{"n":5,"text":"The drawings were rediscovered in 1975 by the Medici chapel's then director, who suspected that what was then a coal-storage room might be hiding something. Paola D'Agostino, director of the Bargello until mid-January, felt it was important to finally make the room accessible to the public. It shows \"Michelangelo's human aspect\", she says, though she admits that it is impossible to attribute the drawings securely to the master and concedes that some of the doodles are probably not his work."},{"n":6,"text":"Other experts doubt it was Michelangelo's hand who drew them. Antonio Forcellino, who has written two biographies of the artist, believes that none of the drawings is of high enough quality to merit firm attribution. William Wallace, a professor at Washington University in St Louis and a leading expert on Michelangelo, thinks that only a couple maybe by the artist-a head that resembles the famous Laocoon statue Michelangelo had seen in Rome, as well as a standing male figure gracing a whole wall near the stairs-and that most were made by some of the 5o or so workmen employed to build the chapel above."},{"n":7,"text":"As for Michelangelo hiding in the room? “That's totally bogus,” according to Mr Wallace. The alreadyfamous artist is more likely to have been protected by a friend. Yet Mr Wallace argues that the room is a landmark finding nonetheless, because Michelangelo's workmen \"are in some ways equal in importance to Michelangelo\" himself. Greatness does not exist in isolation."},{"n":8,"text":"Just as the little guys are often overshadowed by the old masters they worked for, drawing often loses out to flashier forms like painting and sculpture.But the humble medium communicates the presence of hands, and minds, in motion."},{"n":9,"text":"Looking at these walls, you feel as if the artists who adorned them nearly five centuries ago-perhaps hiding from the summer heat, or taking a drink from the well have just left. Even if this is not the work of Michelangelo, it evokes his world."}]}];
const $=id=>document.getElementById(id);let current=0,fontSize=19,lineHeight=1.85,query='';
let done=JSON.parse(localStorage.getItem('reading15_done')||'{}'),saved=JSON.parse(localStorage.getItem('reading15_saved')||'{}'),slashes=JSON.parse(localStorage.getItem('reading15_slashes')||'{}'),slashMode=false;
function key(a,n){return a.number+'-'+n}function persist(){localStorage.setItem('reading15_done',JSON.stringify(done));localStorage.setItem('reading15_saved',JSON.stringify(saved));localStorage.setItem('reading15_slashes',JSON.stringify(slashes))}
function progress(a){let c=a.paragraphs.filter(p=>done[key(a,p.n)]).length;return{c,t:a.paragraphs.length,p:Math.round(c/a.paragraphs.length*100)}}
function overall(){let t=0,c=0;ARTICLES.forEach(a=>{t+=a.paragraphs.length;c+=a.paragraphs.filter(p=>done[key(a,p.n)]).length});$('totalProgress').textContent=Math.round(c/t*100)+'%'}
let showingStudyDirectory=false;
function renderDirectory(){let host=$('directoryEntries');host.innerHTML='';ARTICLES.forEach((a,i)=>{let b=document.createElement('button');b.className='directory-entry';b.type='button';let num=document.createElement('span');num.className='directory-entry-number';num.textContent=String(i+1).padStart(2,'0');let title=document.createElement('span');title.className='directory-entry-title';title.textContent=a.title;let arrow=document.createElement('span');arrow.className='directory-entry-arrow';arrow.textContent='›';b.append(num,title,arrow);b.onclick=()=>{current=i;showingStudyDirectory=false;renderArticle();switchReaderTab('study');window.scrollTo(0,0)};host.append(b)})}
function renderList(){let list=$('articleList');let found=ARTICLES.map((a,i)=>({a,i})).filter(x=>(x.a.title+' '+x.a.subtitle+' '+x.a.paragraphs.map(p=>p.text).join(' ')).toLowerCase().includes(query.toLowerCase()));$('articleCount').textContent=found.length+' ARTICLES';list.innerHTML='';if(!found.length){list.innerHTML='<div class="empty">没有找到匹配的文章</div>';return}found.forEach(x=>{let p=progress(x.a),b=document.createElement('button');b.className='article-item'+(x.i===current?' active':'');let num=document.createElement('span');num.className='item-num';num.textContent=String(x.i+1).padStart(2,'0');let wrap=document.createElement('span'),title=document.createElement('span'),meta=document.createElement('span'),check=document.createElement('span');title.className='item-title';title.textContent=x.a.title;meta.className='item-meta';meta.textContent='SOURCE NO. '+x.a.number+' · '+p.c+'/'+p.t+' 段';wrap.append(title,meta);check.className='item-check';check.textContent=p.p===100?'✓':p.p?'·':'';b.append(num,wrap,check);b.onclick=()=>{current=x.i;renderArticle();$('mainLayout').classList.add('nav-collapsed');$('sidebar').classList.remove('open');window.scrollTo(0,0)};list.append(b)})}
function toast(msg){let t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300)}

function renderParagraphText(el,a,par){let points=slashes[key(a,par.n)]||[],text=par.text;el.innerHTML='';let last=0;points.forEach(pos=>{el.append(document.createTextNode(text.slice(last,pos)));let mark=document.createElement('span');mark.className='slash-mark';mark.textContent=' / ';mark.title='点击删除此处断句';mark.onclick=e=>{e.stopPropagation();slashes[key(a,par.n)]=(slashes[key(a,par.n)]||[]).filter(x=>x!==pos);persist();renderParagraphText(el,a,par)};el.append(mark);last=pos});el.append(document.createTextNode(text.slice(last)))}
function getTextOffset(el,e){let range=null;if(document.caretRangeFromPoint)range=document.caretRangeFromPoint(e.clientX,e.clientY);else if(document.caretPositionFromPoint){let p=document.caretPositionFromPoint(e.clientX,e.clientY);if(p){range=document.createRange();range.setStart(p.offsetNode,p.offset);range.collapse(true)}}if(!range)return 0;let pre=range.cloneRange();pre.selectNodeContents(el);pre.setEnd(range.startContainer,range.startOffset);return pre.toString().replace(/ \/ /g,'').length}
function nearestBoundary(text,offset){let p=Math.max(1,Math.min(text.length-1,offset)),left=p,right=p;while(left>0&&!/\s|[,;:.!?—]/.test(text[left-1]))left--;while(right<text.length&&!/\s|[,;:.!?—]/.test(text[right]))right++;let candidates=[left,right].filter(x=>x>0&&x<text.length);if(!candidates.length)return p;return candidates.sort((a,b)=>Math.abs(a-p)-Math.abs(b-p))[0]}
function switchReaderTab(which){let article=which==='article';$('articleViewParts').classList.toggle('hidden',!article);$('studyPanel').classList.toggle('active',!article&&!showingStudyDirectory);$('studyDirectory').classList.toggle('active',!article&&showingStudyDirectory);$('studyDirectoryBack').classList.toggle('visible',!article&&!showingStudyDirectory);$('articleTab').classList.toggle('active',article);$('studyTab').classList.toggle('active',!article);if(!article&&showingStudyDirectory)renderDirectory();else if(!article)window.renderStudyNotes&&window.renderStudyNotes()}
function renderArticle(){if(current!==0&&$('studyPanel').classList.contains('active'))switchReaderTab('article');let a=ARTICLES[current],p=progress(a);$('sourceLabel').textContent='ARTICLE '+String(current+1).padStart(2,'0')+' / SOURCE NO. '+a.number;$('articleKicker').textContent='ARTICLE '+String(current+1).padStart(2,'0')+' · '+a.paragraphs.length+' PARAGRAPHS';$('articleTitle').textContent=a.title;$('articleSubtitle').textContent=a.subtitle;$('articleSubtitle').style.display=a.subtitle?'block':'none';$('articleProgressBar').style.width=p.p+'%';$('progressText').textContent=p.c+' / '+p.t+' 段已完成';$('progressPercent').textContent=p.p+'%';let root=$('paragraphs');root.innerHTML='';a.paragraphs.forEach(par=>{let row=document.createElement('article');row.className='para'+(done[key(a,par.n)]?' done':'');let num=document.createElement('div');num.className='para-num';num.textContent=String(par.n).padStart(2,'0');let body=document.createElement('p');body.className='para-text'+(slashMode?' slash-mode':'');renderParagraphText(body,a,par);body.onclick=e=>{if(!slashMode)return;let k=key(a,par.n),arr=slashes[k]||[],offset=getTextOffset(body,e);let pos=nearestBoundary(par.text,offset);if(arr.includes(pos))arr=arr.filter(x=>x!==pos);else arr.push(pos);arr.sort((x,y)=>x-y);if(arr.length)slashes[k]=arr;else delete slashes[k];persist();renderParagraphText(body,a,par)};let actions=document.createElement('div');actions.className='para-actions';let d=document.createElement('button'),s=document.createElement('button');d.className='para-action done-btn'+(done[key(a,par.n)]?' on':'');d.textContent='✓';d.title='标记已读';s.className='para-action save-btn'+(saved[key(a,par.n)]?' on':'');s.textContent=saved[key(a,par.n)]?'★':'☆';s.title='收藏段落';d.onclick=()=>{let k=key(a,par.n);if(done[k])delete done[k];else done[k]=true;persist();renderArticle()};s.onclick=()=>{let k=key(a,par.n);if(saved[k])delete saved[k];else saved[k]=true;persist();s.classList.toggle('on',!!saved[k]);s.textContent=saved[k]?'★':'☆';toast(saved[k]?'已收藏这一段':'已取消收藏')};actions.append(d,s);row.append(num,body,actions);root.append(row)});$('prevBtn').disabled=current===0;$('nextBtn').disabled=current===ARTICLES.length-1;renderList();overall();document.querySelectorAll('.para-text').forEach(el=>{el.style.fontSize=fontSize+'px';el.style.lineHeight=lineHeight})}
$('search').oninput=e=>{query=e.target.value;renderList()};$('prevBtn').onclick=()=>{if(current){current--;renderArticle();window.scrollTo(0,0)}};$('nextBtn').onclick=()=>{if(current<ARTICLES.length-1){current++;renderArticle();window.scrollTo(0,0)}};$('larger').onclick=()=>{fontSize=Math.min(25,fontSize+1);renderArticle()};$('smaller').onclick=()=>{fontSize=Math.max(15,fontSize-1);renderArticle()};$('lineHeight').onclick=()=>{lineHeight=lineHeight===1.85?2.05:lineHeight===2.05?1.65:1.85;renderArticle();toast('行距：'+lineHeight)};$('themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('reading15_dark',document.body.classList.contains('dark')?'1':'0')};if(localStorage.getItem('reading15_dark')==='1')document.body.classList.add('dark');$('toggleList').onclick=()=>{let closed=$('mainLayout').classList.toggle('nav-collapsed');$('sidebar').classList.toggle('open',!closed)};$('articleTab').onclick=()=>{showingStudyDirectory=false;switchReaderTab('article')};$('studyTab').onclick=()=>{showingStudyDirectory=true;switchReaderTab('study')};$('studyDirectoryBack').onclick=()=>{showingStudyDirectory=true;switchReaderTab('study');window.scrollTo(0,0)};$('slashMode').onclick=()=>{slashMode=!slashMode;$('slashMode').classList.toggle('active',slashMode);$('slashMode').textContent=slashMode?'✓ 断句笔已开启':'✎ 断句笔';renderArticle()};$('clearSlashes').onclick=()=>{let a=ARTICLES[current];a.paragraphs.forEach(p=>delete slashes[key(a,p.n)]);persist();renderArticle();toast('已清除当前文章的斜杠标记')};
renderArticle();
</script><script src="study-notes.js?v=optionanalysis2"></script></body></html>
